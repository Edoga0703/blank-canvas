name: Meta reconciliation

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Executar sincronização inicial completa"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: meta-reconciliation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://capiconversa.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$CRON_SECRET" || { echo "Configure the CRON_SECRET Actions secret." >&2; exit 1; }
          case "$APP_URL" in
            https://*) ;;
            *) echo "PUBLIC_APP_URL must start with https://" >&2; exit 1 ;;
          esac

      - name: Reconcile Meta channels
        shell: bash
        env:
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full && '1' || '0' }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 240 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/public/hooks/meta-sync?limit=50&full=$FULL_SYNC"
